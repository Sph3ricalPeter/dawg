[workspace]
resolver = "2"
members = ["crates/dawg-core", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Sph3ricalPeter <sph3ricalpeter@gmail.com>"]

[profile.dev]
# Keeps target/ from ballooning under long `tauri dev` sessions while keeping
# file:line in panics.
debug = "line-tables-only"
