[package]
name = "dawg-cli"
description = "dawg from the command line, and its MCP server for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "dawg-cli"
path = "src/main.rs"

[dependencies]
dawg-core = { path = "../dawg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
